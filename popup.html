<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Audio Equalizer</title>
<link rel="stylesheet" href="popup.css">
<script src="popup.js" defer></script>
</head>
<body>
  <header>
    <h1>Audio Equalizer</h1>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <section class="controls">
    <select id="preset">
      <option value="flat">Flat</option>
      <option value="bass">Bass Boost</option>
      <option value="treble">Treble Boost</option>
      <option value="vocal">Vocal Boost</option>
      <option value="loudness">Loudness</option>
      <option value="rock">Rock</option>
      <option value="pop">Pop</option>
      <option value="classical">Classical</option>
      <option value="custom">Custom</option>
    </select>
    <button id="reset" type="button">Reset</button>
  </section>

  <section class="eq">
    <div class="band preamp-band">
      <div class="band-value" id="preampValue">0 dB</div>
      <input type="range" class="vertical" id="preampSlider" min="-20" max="20" step="0.5" value="0">
      <div class="band-label">Pre</div>
    </div>
    <div class="divider"></div>
    <div id="bands" class="eq-bands"></div>
  </section>

  <footer>
    <p class="muted">Shapes audio and video playback on the pages you visit. Open tabs already playing media may need a refresh to pick it up.</p>
  </footer>
</body>
</html>
